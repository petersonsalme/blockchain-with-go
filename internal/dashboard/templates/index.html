<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false}'>
<title>bwg network dashboard</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js"></script>
</head>
<body>
<header>
<h1>bwg network</h1>
<nav aria-label="Nodes">
{{- range .Nodes}}
<a href="/n/{{.Name}}/"{{if eq .Name $.Current}} aria-current="page"{{end}}>{{.Name}}</a>
{{- end}}
</nav>
</header>
<main id="main">
{{- if .Network}}
{{template "network" .Network}}
{{- end}}
</main>
</body>
</html>
