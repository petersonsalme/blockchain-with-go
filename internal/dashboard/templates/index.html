<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false}'>
<title>bwg network dashboard</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js"></script>
</head>
<body>
<header>
<h1><a href="/">bwg network</a></h1>
<nav aria-label="Nodes">
<a href="/peers">Peers</a>
<a href="/metrics">Metrics</a>
{{- range .Nodes}}
<a href="/n/{{pe .Name}}/"{{if eq .Name $.Current}} aria-current="page"{{end}}>{{.Name}}</a>
{{- end}}
</nav>
<form method="get" action="/search" role="search">
<select name="node" aria-label="Node">
{{- range .Nodes}}
<option value="{{.Name}}"{{if eq .Name $.Current}} selected{{end}}>{{.Name}}</option>
{{- end}}
</select>
<input type="search" name="q" maxlength="128" required aria-label="Search" placeholder="height, hash, tx id or address">
<button type="submit">Search</button>
</form>
</header>
{{- if .Current}}
<nav aria-label="Node screens" class="subnav">
<a href="/n/{{pe .Current}}/mempool">Mempool</a>
<a href="/n/{{pe .Current}}/blocks">Blocks</a>
</nav>
{{- end}}
<main id="main">
{{.Body}}
</main>
</body>
</html>
