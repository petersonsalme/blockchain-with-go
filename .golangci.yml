version: "2"
linters:
  enable:
    # Formatting and readability
    - decorder
    - dupword
    - embeddedstructfieldcheck
    - funcorder
    - godot
    - grouper
    - misspell
    - nlreturn
    - tagalign
    - whitespace
    - wsl_v5
    # Correctness and errors
    - copyloopvar
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - makezero
    - nilerr
    - nilnesserr
    - nilnil
    - noinlineerr
    - reassign
    - recvcheck
    - unconvert
    - wastedassign
    # Security
    - gosec
    # Resources and contexts
    - bodyclose
    - containedctx
    - contextcheck
    - noctx
    - rowserrcheck
    - sqlclosecheck
    # Idioms and modernization
    - canonicalheader
    - dogsled
    - errname
    - exptostd
    - iface
    - importas
    - inamedparam
    - intrange
    - iotamixing
    - mirror
    - modernize
    - nakedret
    - perfsprint
    - prealloc
    - predeclared
    - usestdlibvars
    # Structure and complexity
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocyclo
    - godoclint
    - godox
    - maintidx
    - nestif
    # Linter hygiene
    - gocritic
    - nolintlint
    - revive
    - unparam
    # Tests
    - ginkgolinter
    - testifylint
    - thelper
    - tparallel
    - usetesting
    # Logging and encoding
    - sloglint
    - tagliatelle
  settings:
    nlreturn:
      # Same threshold as wsl_v5's branch-max-lines: a return in a block of up to 2 lines needs no blank line.
      block-size: 3
    wsl_v5:
      enable:
        - leading-whitespace
        - trailing-whitespace
    tagliatelle:
      case:
        rules:
          # The HTTP contract (openapi.yaml) and the peer protocol use snake_case.
          json: snake
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    rules:
      # AGENTS.md limits package-level state to const and errors.New sentinels in internal/server and internal/chain only.
      # The other packages hold lookup tables and bucket names that cannot be const.
      - path: ^(cmd|client|pkg)/|^internal/(consensus|domain|mempool|p2p|storage|vm)/
        linters: [gochecknoglobals]
      # Transaction is hashed and persisted with its Go field names; renaming "Contract" would change the schema.
      - path: internal/domain/transaction\.go
        linters: [tagliatelle]
        text: "'Contract'"
      # The snapshot file format (ENG-168) already ships with a camelCase blockHash key.
      - path: internal/storage/snapshotfile(_test)?\.go
        linters: [tagliatelle]
        text: "blockHash"
      # G101: the matches are the names of environment variables, not credentials.
      - path: cmd/bwg/node\.go
        linters: [gosec]
        text: "G101"
      # G304/G306/G703: the CLI, the keystore and the peer book open paths given by the operator
      # (flags, DATA_DIR, keystore location), never paths taken from a request. A snapshot file is public chain data.
      - path: (cmd/bwg/(node|snapshot)|internal/p2p/persist|pkg/wallet/keystore)\.go
        linters: [gosec]
        text: "G(304|306|703)"
      # G115: heights, sizes and VM jump targets are bounded (jump checks dest < len(code); block size is capped by MaxBlockBytes).
      - path: internal/(storage/bolt/|mempool/mempool\.go|vm/vm\.go|domain/merkle\.go)
        linters: [gosec]
        text: "G115"
      # The table entries are fixtures that set an environment variable, not test helpers.
      - path: cmd/bwg/consensus_test\.go
        linters: [thelper]
      # client.gen.go carries its own package comment and is not edited by hand.
      - path: client/
        linters: [godoclint]
      # The root command builds its own context for graceful shutdown (see node.go), so callers cannot pass one.
      - path: cmd/bwg/(main|wallet_test)\.go
        linters: [contextcheck]
      # Keys with surrounding spaces are deliberate trimming cases.
      - path: cmd/bwg/p2p_test.go
        linters: [gocritic]
        text: mapKey
      # Test fixtures use fixed seeds, local URLs and small constants.
      - path: _test\.go
        linters: [gosec, unparam, forcetypeassert, errchkjson, nilnil, prealloc, gochecknoinits, goconst, containedctx, gochecknoglobals]
      - path: internal/(storage/storagetest|consensus/consensustest)/
        linters: [prealloc, goconst, gocyclo, maintidx]
      - path: internal/server/contract_test\.go
        linters: [maintidx]
      - path: _test\.go
        linters: [revive]
        text: "(redefines-builtin-id|context-as-argument|empty-block)"
      - path: internal/storage/storagetest/
        linters: [unparam]
      # Ginkgo/Gomega contract suites use dot imports by convention.
      - path: internal/(consensus/consensustest|storage/storagetest)/
        linters: [staticcheck]
        text: "ST1001"
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/petersonsalme/blockchain-with-go
    goimports:
      local-prefixes:
        - github.com/petersonsalme/blockchain-with-go
