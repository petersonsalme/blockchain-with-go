openapi: 3.0.3
info:
  title: blockchain-with-go node API
  version: 1.0.0
  description: |
    HTTP API of the educational blockchain node. This file is the contract of
    `internal/server`; `internal/server/contract_test.go` checks the server against it
    and `client/` is generated from it (ADR-0007).

    Every route can also answer 429 when the per-IP rate limit (`RATE_LIMIT`) is enabled.
    The generic ServeMux answers (405 with `Allow`, `HEAD`) are not described.
paths:
  /:
    get:
      operationId: getBlockchain
      summary: List the whole chain
      responses:
        "200":
          description: Every block, genesis first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/blocksResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: writeBlock
      summary: Mine a block with the given signed transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/message"
      responses:
        "201":
          description: The mined block, already appended to the chain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/block"
        "400":
          description: Malformed body, empty transaction list, bad ID, missing timestamp or a transaction rejected as malformed (missing/invalid signature or key, owner mismatch, invalid output, missing inputs).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "408":
          description: Mining was cancelled (client went away).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "409":
          description: An input is missing or already spent, the transaction double-spends, or the chain changed during mining (`chain_conflict`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "413":
          description: Request body exceeds the maximum size (`request_too_large`; `details.max` is the limit).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "422":
          description: Inputs do not cover the outputs, or the block was rejected by validation or consensus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          description: Mining exceeded `MINING_TIMEOUT`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /blocks:
    get:
      operationId: getBlocks
      summary: Page through the chain
      parameters:
        - name: from
          in: query
          description: First height of the page.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Page size; values above 100 are capped at 100.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: One page of blocks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/pageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /block/{ref}:
    get:
      operationId: getBlock
      summary: Get one block by hash or height
      parameters:
        - name: ref
          in: path
          required: true
          description: Block hash (64 lowercase hex characters) or height (decimal).
          schema:
            type: string
            pattern: '^([0-9]{1,63}|[0-9a-f]{64})$'
      responses:
        "200":
          description: The block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/block"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /tx/{id}:
    get:
      operationId: getTx
      summary: Get one transaction and the block that contains it
      parameters:
        - name: id
          in: path
          required: true
          description: Transaction ID (64 lowercase hex characters).
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      responses:
        "200":
          description: The transaction with its block hash and height.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/txResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /tx/{id}/proof:
    get:
      operationId: getTxProof
      summary: Get the Merkle inclusion proof of a transaction
      parameters:
        - name: id
          in: path
          required: true
          description: Transaction ID (64 lowercase hex characters).
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      responses:
        "200":
          description: The sibling path from the transaction leaf to the Merkle root of its block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/proofResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /balance/{addr}:
    get:
      operationId: getBalance
      summary: Get the balance and unspent outputs of an address
      parameters:
        - name: addr
          in: path
          required: true
          description: Wallet address (lowercase hex with version and checksum).
          schema:
            type: string
      responses:
        "200":
          description: The balance and the unspent outputs of the address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/balanceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /health:
    get:
      operationId: getHealth
      summary: Report the chain tip
      responses:
        "200":
          description: The node is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/healthResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: The chain cannot be read (`unhealthy`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /metrics:
    get:
      operationId: getMetrics
      summary: Expose Prometheus metrics
      description: >-
        Prometheus text exposition format 0.0.4 (ADR-0010):
        `http_requests_total{method,route,code}`, `blockchain_blocks` (omitted when the
        tip cannot be read) and `blockchain_mining_duration_seconds`.
      responses:
        "200":
          description: The metrics in the Prometheus text format.
          content:
            text/plain; version=0.0.4; charset=utf-8:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/RateLimited"
  /events:
    get:
      operationId: getEvents
      summary: Stream node events (server-sent events)
      description: >-
        Long-lived `text/event-stream`. The node sends `event: block` with the mined block as
        one-line JSON (the body of the `201` of `POST /` or `POST /mine`) after each block it
        mines, and `event: tx` with the admitted transaction as one-line JSON after each
        `202` of `POST /tx`. A client that falls more than 16 events behind is disconnected;
        there is no replay of missed events.
      responses:
        "200":
          description: >-
            The stream is open. Each event is `event: block` or `event: tx`, then
            `data: <JSON>`, then a blank line.
          content:
            text/event-stream:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/RateLimited"
  /legacy/bpm:
    post:
      operationId: legacyBpm
      deprecated: true
      summary: Removed endpoint that accepted unsigned BPM payloads
      description: Always answers 410 with the `Deprecation` header. Send signed transactions to `POST /`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "410":
          description: The endpoint was removed (`endpoint_gone`).
          headers:
            Deprecation:
              description: Always `true`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /tx:
    post:
      operationId: submitTx
      summary: Admit one signed transaction into the mempool
      description: Applies the checks of `POST /` to the transaction against the confirmed UTXO set and admits it into the pool (ADR-0012). It never mines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/transaction"
      responses:
        "202":
          description: The transaction is in the pool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/submitResponse"
        "400":
          description: Malformed body, bad ID, missing timestamp or a transaction rejected as malformed (missing/invalid signature or key, owner mismatch, invalid output, missing inputs).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "409":
          description: Already in the pool (`duplicate_tx`), spends an outpoint a pool transaction spends (`mempool_conflict`), the pool is full and the fee rate is too low (`mempool_full`), or an input is missing or already spent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "413":
          description: Request body exceeds the maximum size (`request_too_large`; `details.max` is the limit).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "422":
          description: Inputs do not cover the outputs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /mine:
    post:
      operationId: minePending
      summary: Mine a block from the mempool
      description: Takes the pool transactions of highest fee per byte that fit `MAX_BLOCK_BYTES`, in selection order (fee rate descending, then ID); an empty pool mines an empty block. Same timeout and errors as `POST /`.
      responses:
        "201":
          description: The mined block, already appended to the chain; its transactions left the pool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/block"
        "408":
          description: Mining was cancelled (client went away).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "409":
          description: The chain changed during mining (`chain_conflict`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "422":
          description: The block was rejected by validation or consensus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          description: Mining exceeded `MINING_TIMEOUT`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /mempool:
    get:
      operationId: getMempool
      summary: List the mempool in selection order
      responses:
        "200":
          description: Every pool transaction, fee rate descending, then ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/mempoolResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /p2p/hello:
    post:
      operationId: p2pHello
      summary: Peer handshake
      description: A peer sends its hello; the node checks it (ADR-0013), registers the sender as an inbound peer and answers its own hello. The body must hold exactly the hello fields; an unknown field is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/hello"
      responses:
        "200":
          description: Handshake accepted; the body is the local hello.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/hello"
        "400":
          description: Invalid JSON, unknown field or malformed hello (`invalid_hello`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "404":
          description: The node has no peer-to-peer layer (`p2p_disabled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "409":
          description: Incompatible protocol version (`incompatible_version`), different genesis (`genesis_mismatch`) or the caller is this node (`self_connection`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "413":
          description: Request body exceeds the maximum size (`request_too_large`; `details.max` is the limit).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: The inbound peer limit is reached (`peer_limit`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /p2p/peers:
    get:
      operationId: getP2PPeers
      summary: List the connected peers and the known addresses
      responses:
        "200":
          description: Connected peers and known peer addresses, in the order the peer book returns them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/peersResponse"
        "404":
          description: The node has no peer-to-peer layer (`p2p_disabled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  responses:
    BadRequest:
      description: A path or query value is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    NotFound:
      description: No such block or transaction.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    RateLimited:
      description: The per-IP rate limit was exceeded (`rate_limited`).
      headers:
        Retry-After:
          description: Seconds until a request is accepted again.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    InternalError:
      description: The chain could not be read or written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
  schemas:
    errorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Stable machine-readable error code.
        details:
          type: object
          additionalProperties: true
    message:
      type: object
      required: [Transactions]
      properties:
        Transactions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/transaction"
    transaction:
      type: object
      required: [Inputs, Outputs, Timestamp]
      properties:
        ID:
          type: string
          description: Optional in requests (the node fills it in); when present it must equal the calculated hash.
        Inputs:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/txIn"
        Outputs:
          type: array
          items:
            $ref: "#/components/schemas/txOut"
        Timestamp:
          type: string
          format: date-time
    txIn:
      type: object
      required: [PrevTxID, OutIndex, PublicKey, Signature]
      properties:
        PrevTxID:
          type: string
        OutIndex:
          type: integer
          format: uint32
        PublicKey:
          type: string
        Signature:
          type: string
    txOut:
      type: object
      required: [Amount, Address]
      properties:
        Amount:
          type: integer
          format: uint64
        Address:
          type: string
    block:
      type: object
      required: [Index, Timestamp, Transactions, Hash, PrevHash, Nonce, Difficulty, Validator, Signature]
      properties:
        Index:
          type: integer
        Timestamp:
          type: string
          format: date-time
        Transactions:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/transaction"
        Hash:
          type: string
        PrevHash:
          type: string
        Nonce:
          type: integer
        Difficulty:
          type: integer
        Validator:
          type: string
        Signature:
          type: string
    blocksResponse:
      type: object
      required: [Blocks]
      properties:
        Blocks:
          type: array
          items:
            $ref: "#/components/schemas/block"
    pageResponse:
      type: object
      required: [blocks, from, limit]
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/block"
        from:
          type: integer
        limit:
          type: integer
        next:
          type: integer
          description: Height of the next page; present only when a block exists there.
    healthResponse:
      type: object
      required: [status, height, tip]
      properties:
        status:
          type: string
        height:
          type: integer
        tip:
          type: string
    txResponse:
      type: object
      required: [transaction, block_hash, height]
      properties:
        transaction:
          $ref: "#/components/schemas/transaction"
        block_hash:
          type: string
        height:
          type: integer
    proofStep:
      type: object
      required: [hash, side]
      properties:
        hash:
          type: string
        side:
          type: string
          enum: [left, right]
    proofResponse:
      type: object
      required: [tx_id, block_index, block_hash, merkle_root, leaf_index, leaf_hash, proof]
      properties:
        tx_id:
          type: string
        block_index:
          type: integer
        block_hash:
          type: string
        merkle_root:
          type: string
        leaf_index:
          type: integer
        leaf_hash:
          type: string
        proof:
          type: array
          items:
            $ref: "#/components/schemas/proofStep"
    utxo:
      type: object
      required: [txid, index, amount]
      properties:
        txid:
          type: string
        index:
          type: integer
          format: uint32
        amount:
          type: integer
          format: uint64
    balanceResponse:
      type: object
      required: [address, balance, utxos]
      properties:
        address:
          type: string
        balance:
          type: integer
          format: uint64
        utxos:
          type: array
          items:
            $ref: "#/components/schemas/utxo"
    submitResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string
    mempoolResponse:
      type: object
      required: [transactions]
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/transaction"
    hello:
      type: object
      required: [version, node_id, genesis_hash, height, tip_hash, listen_addr]
      properties:
        version:
          type: integer
        node_id:
          type: string
          description: 32 lowercase hex characters.
        genesis_hash:
          type: string
          description: 64 lowercase hex characters.
        height:
          type: integer
          minimum: 0
        tip_hash:
          type: string
          description: 64 lowercase hex characters.
        listen_addr:
          type: string
          description: Base URL where the sender accepts peers, or empty.
    peer:
      type: object
      required: [node_id, addr, height, tip_hash, inbound, last_seen]
      properties:
        node_id:
          type: string
        addr:
          type: string
        height:
          type: integer
        tip_hash:
          type: string
        inbound:
          type: boolean
        last_seen:
          type: string
          format: date-time
    peersResponse:
      type: object
      required: [peers, addrs]
      properties:
        peers:
          type: array
          items:
            $ref: "#/components/schemas/peer"
        addrs:
          type: array
          items:
            type: string
