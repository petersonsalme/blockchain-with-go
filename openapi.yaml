openapi: 3.0.3
info:
  title: blockchain-with-go node API
  version: 1.0.0
  description: |
    HTTP API of the educational blockchain node. This file is the contract of
    `internal/server`; `internal/server/contract_test.go` checks the server against it
    and `client/` is generated from it (ADR-0007).

    Every route can also answer 429 when the per-IP rate limit (`RATE_LIMIT`) is enabled.
    The generic ServeMux answers (405 with `Allow`, `HEAD`) are not described.
paths:
  /:
    get:
      operationId: getBlockchain
      summary: List the whole chain
      responses:
        "200":
          description: Every block, genesis first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/blocksResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: writeBlock
      summary: Mine a block with the given signed transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/message"
      responses:
        "201":
          description: The mined block, already appended to the chain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/block"
        "400":
          description: Malformed body, empty transaction list, bad ID, missing timestamp or a transaction rejected as malformed (missing/invalid signature or key, owner mismatch, invalid output, missing inputs).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "408":
          description: Mining was cancelled (client went away).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "409":
          description: An input is missing or already spent, the transaction double-spends, or the chain changed during mining (`chain_conflict`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "413":
          description: Request body exceeds the maximum size (`request_too_large`; `details.max` is the limit).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "422":
          description: Inputs do not cover the outputs, or the block was rejected by validation or consensus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          description: Mining exceeded `MINING_TIMEOUT`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /blocks:
    get:
      operationId: getBlocks
      summary: Page through the chain
      parameters:
        - name: from
          in: query
          description: First height of the page.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Page size; values above 100 are capped at 100.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: One page of blocks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/pageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /headers:
    get:
      operationId: getHeaders
      summary: Page through the chain headers
      parameters:
        - name: from
          in: query
          description: First height of the page.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Page size; values above 1000 are capped at 1000.
          schema:
            type: integer
            minimum: 1
            default: 1000
      responses:
        "200":
          description: One page of headers; every block has null Transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/pageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /block/{ref}:
    get:
      operationId: getBlock
      summary: Get one block by hash or height
      parameters:
        - name: ref
          in: path
          required: true
          description: Block hash (64 lowercase hex characters) or height (decimal).
          schema:
            type: string
            pattern: '^([0-9]{1,63}|[0-9a-f]{64})$'
      responses:
        "200":
          description: The block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/block"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: The block body was pruned; only its header is kept (`block_pruned`, ADR-0014).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /tx/{id}:
    get:
      operationId: getTx
      summary: Get one transaction and the block that contains it
      parameters:
        - name: id
          in: path
          required: true
          description: Transaction ID (64 lowercase hex characters).
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      responses:
        "200":
          description: The transaction with its block hash and height.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/txResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /tx/{id}/proof:
    get:
      operationId: getTxProof
      summary: Get the Merkle inclusion proof of a transaction
      parameters:
        - name: id
          in: path
          required: true
          description: Transaction ID (64 lowercase hex characters).
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      responses:
        "200":
          description: The sibling path from the transaction leaf to the Merkle root of its block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/proofResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /balance/{addr}:
    get:
      operationId: getBalance
      summary: Get the balance and unspent outputs of an address
      parameters:
        - name: addr
          in: path
          required: true
          description: Wallet address (lowercase hex with version and checksum).
          schema:
            type: string
      responses:
        "200":
          description: The balance and the unspent outputs of the address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/balanceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /address/{addr}/txs:
    get:
      operationId: getAddressTxs
      summary: Get the confirmed transaction history of an address, newest first
      description: >
        One page of the transactions that create or spend an output of the address,
        ordered by block height then position in the block, descending. Pending
        transactions are not listed. A pruned node lists only heights at or above
        `pruned_below`.
      parameters:
        - name: addr
          in: path
          required: true
          description: Wallet address (lowercase hex with version and checksum).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size; values above 100 are clamped to 100.
          schema:
            type: integer
            minimum: 1
            default: 25
        - name: after
          in: query
          required: false
          description: Id of the last transaction of the previous page; the page starts strictly after it.
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      responses:
        "200":
          description: One page of the address history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/addressTxsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: The `after` cursor is not in the address history (`unknown_cursor`); restart from the first page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /contracts/{id}:
    get:
      operationId: getContract
      summary: Get the code and storage of a deployed contract
      description: The ID of a contract is the ID of the transaction that deployed it (ADR-0014). The state is the confirmed one; a deploy or call still in the mempool is not visible.
      parameters:
        - name: id
          in: path
          required: true
          description: Contract ID, 64 lowercase hex characters.
          schema:
            type: string
      responses:
        "200":
          description: The contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/contractResponse"
        "400":
          description: The ID is not 64 lowercase hex characters (`invalid_contract_id`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "404":
          description: No contract with that ID is deployed (`contract_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /health:
    get:
      operationId: getHealth
      summary: Report the chain tip
      responses:
        "200":
          description: The node is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/healthResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: The chain cannot be read (`unhealthy`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /metrics:
    get:
      operationId: getMetrics
      summary: Expose Prometheus metrics
      description: >-
        Prometheus text exposition format 0.0.4 (ADR-0010):
        `http_requests_total{method,route,code}`, `blockchain_blocks` (omitted when the
        tip cannot be read) and `blockchain_mining_duration_seconds`.
      responses:
        "200":
          description: The metrics in the Prometheus text format.
          content:
            text/plain; version=0.0.4; charset=utf-8:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/RateLimited"
  /events:
    get:
      operationId: getEvents
      summary: Stream node events (server-sent events)
      description: >-
        Long-lived `text/event-stream`. The node sends `event: block` with the block as
        one-line JSON after each block it appends, and `event: tx` with the transaction as
        one-line JSON after each transaction it admits, whatever the source: its own mining
        (`POST /` or `POST /mine`), `POST /tx`, a peer through gossip (`POST /p2p/block` or
        `POST /p2p/tx` answered `accepted`; `known` and rejections send nothing), sync
        extension (one event per block) and reorg (one event per block of the new branch,
        oldest first). There is no `reorg` event and no `tx` event for transactions put back
        in the pool by a reorg. A client that falls more than 16 events behind is disconnected;
        there is no replay of missed events.
      responses:
        "200":
          description: >-
            The stream is open. Each event is `event: block` or `event: tx`, then
            `data: <JSON>`, then a blank line.
          content:
            text/event-stream:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/RateLimited"
  /legacy/bpm:
    post:
      operationId: legacyBpm
      deprecated: true
      summary: Removed endpoint that accepted unsigned BPM payloads
      description: Always answers 410 with the `Deprecation` header. Send signed transactions to `POST /`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "410":
          description: The endpoint was removed (`endpoint_gone`).
          headers:
            Deprecation:
              description: Always `true`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /tx:
    post:
      operationId: submitTx
      summary: Admit one signed transaction into the mempool
      description: Applies the checks of `POST /` to the transaction against the confirmed UTXO set and admits it into the pool (ADR-0012). With a `contract` object it also runs the deploy or call against the confirmed contract state (ADR-0014), so a call that would fail is refused here. It never mines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/transaction"
      responses:
        "202":
          description: The transaction is in the pool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/submitResponse"
        "400":
          description: Malformed body, bad ID, missing timestamp or a transaction rejected as malformed (missing/invalid signature or key, owner mismatch, invalid output, missing inputs), or a malformed contract operation (`invalid_contract_op`) or undeployable code (`invalid_code`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "409":
          description: Already in the pool (`duplicate_tx`), spends an outpoint a pool transaction spends (`mempool_conflict`), the pool is full and the fee rate is too low (`mempool_full`), or an input is missing or already spent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "413":
          description: Request body exceeds the maximum size (`request_too_large`; `details.max` is the limit).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "422":
          description: Inputs do not cover the outputs, or the contract operation fails against the confirmed state (`unknown_contract`, `contract_exists`, `out_of_gas`, `reverted`, `stack_overflow`, `stack_underflow`, `bad_jump`, `arg_index`, `invalid_gas`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /mine:
    post:
      operationId: minePending
      summary: Mine a block from the mempool
      description: Takes the pool transactions of highest fee per byte that fit `MAX_BLOCK_BYTES`, in selection order (fee rate descending, then ID); an empty pool mines an empty block. Same timeout and errors as `POST /`.
      responses:
        "201":
          description: The mined block, already appended to the chain; its transactions left the pool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/block"
        "408":
          description: Mining was cancelled (client went away).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "409":
          description: The chain changed during mining (`chain_conflict`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "422":
          description: The block was rejected by validation or consensus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          description: Mining exceeded `MINING_TIMEOUT`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /mempool:
    get:
      operationId: getMempool
      summary: List the mempool in selection order
      responses:
        "200":
          description: Every pool transaction, fee rate descending, then ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/mempoolResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /p2p/hello:
    post:
      operationId: p2pHello
      summary: Peer handshake
      description: A peer sends its hello; the node checks it (ADR-0013), registers the sender as an inbound peer and answers its own hello. The body must hold exactly the hello fields; an unknown field is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/hello"
      responses:
        "200":
          description: Handshake accepted; the body is the local hello.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/hello"
        "400":
          description: Invalid JSON, unknown field or malformed hello (`invalid_hello`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "403":
          description: The sender is banned for misbehaving during sync (`peer_banned`, ADR-0019).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "404":
          description: The node has no peer-to-peer layer (`p2p_disabled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "409":
          description: Incompatible protocol version (`incompatible_version`), different genesis (`genesis_mismatch`) or the caller is this node (`self_connection`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "413":
          description: Request body exceeds the maximum size (`request_too_large`; `details.max` is the limit).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: The inbound peer limit is reached (`peer_limit`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /p2p/peers:
    get:
      operationId: getP2PPeers
      summary: List the connected peers and the known addresses
      responses:
        "200":
          description: Connected peers and known peer addresses, in the order the peer book returns them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/peersResponse"
        "404":
          description: The node has no peer-to-peer layer (`p2p_disabled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /p2p/inv:
    post:
      operationId: p2pInv
      summary: Announce objects by hash (gossip)
      description: A connected peer announces 1 to 1000 block or transaction hashes (ADR-0018); the node answers the items it wants, those neither seen recently nor known to the ledger, in request order. `node_id` is the sender's id from the handshake; it is not authentication. The body must hold exactly these fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/invRequest"
      responses:
        "200":
          description: The items the node wants (empty when it has them all).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/wantResponse"
        "400":
          description: Invalid JSON, unknown field, no item or more than 1000, an unknown item type or a hash that is not 64 lowercase hex characters (`invalid_inv`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "403":
          description: The sender is not a connected peer (`unknown_peer`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "404":
          description: The node has no peer-to-peer layer or gossip (`p2p_disabled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "413":
          description: Request body exceeds the maximum size (`request_too_large`; `details.max` is the limit).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /p2p/block:
    post:
      operationId: p2pBlock
      summary: Send a block a peer asked for (gossip)
      description: A connected peer sends a block after the node wanted it in answer to an inv (ADR-0018). The block is relayed to the other peers only after it was appended to the chain, so it must extend the current tip and pass the same checks as a mined block. The block uses the Go field names of `GET /blocks`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/blockGossipRequest"
      responses:
        "200":
          description: "`accepted` when the block was appended, `known` when the node already had it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gossipResponse"
        "400":
          description: Invalid JSON, unknown field or trailing data (`invalid_body`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "403":
          description: The sender is not a connected peer (`unknown_peer`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "404":
          description: The node has no peer-to-peer layer or gossip (`p2p_disabled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "409":
          description: The block does not extend the current tip (`not_on_tip`); sync and forks are not part of gossip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "413":
          description: Request body exceeds the maximum size (`request_too_large`; `details.max` is the limit).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "422":
          description: The block is invalid (`invalid_block`); it is not relayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /p2p/tx:
    post:
      operationId: p2pTx
      summary: Send a transaction a peer asked for (gossip)
      description: A connected peer sends a transaction after the node wanted it in answer to an inv (ADR-0018). The transaction is relayed to the other peers only after the pool admitted it. It uses the Go field names of the mined transaction (`Contract`, not `contract`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/txGossipRequest"
      responses:
        "200":
          description: "`accepted` when the pool admitted the transaction, `known` when the node already had it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/gossipResponse"
        "400":
          description: Invalid JSON, unknown field or trailing data (`invalid_body`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "403":
          description: The sender is not a connected peer (`unknown_peer`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "404":
          description: The node has no peer-to-peer layer or gossip (`p2p_disabled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "413":
          description: Request body exceeds the maximum size (`request_too_large`; `details.max` is the limit).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "422":
          description: The transaction is invalid (`invalid_tx`); it is not relayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  responses:
    BadRequest:
      description: A path or query value is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    NotFound:
      description: No such block or transaction.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    RateLimited:
      description: The per-IP rate limit was exceeded (`rate_limited`).
      headers:
        Retry-After:
          description: Seconds until a request is accepted again.
          required: true
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
    InternalError:
      description: The chain could not be read or written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
  schemas:
    errorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Stable machine-readable error code.
        details:
          type: object
          additionalProperties: true
    message:
      type: object
      required: [Transactions]
      properties:
        Transactions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/transaction"
    transaction:
      type: object
      required: [Inputs, Outputs, Timestamp]
      properties:
        ID:
          type: string
          description: Optional in requests (the node fills it in); when present it must equal the calculated hash.
        Inputs:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/txIn"
        Outputs:
          type: array
          items:
            $ref: "#/components/schemas/txOut"
        Timestamp:
          type: string
          format: date-time
        contract:
          $ref: "#/components/schemas/contractOp"
    contractOp:
      type: object
      description: >-
        The optional `contract` of a transaction, accepted by `POST /tx` and covered by
        its hash and signatures (ADR-0014); mined transactions are served with the Go
        field names (`Contract`, `Kind`, `GasLimit`). A `deploy` carries `code`
        (lowercase hex, 1 to 1024 bytes) and no `target`; a `call` carries `target`
        (the contract ID) and no `code`.
      required: [kind, gas_limit]
      properties:
        kind:
          type: string
          enum: [deploy, call]
        code:
          type: string
        target:
          type: string
        args:
          type: array
          nullable: true
          items:
            type: integer
            format: uint64
        gas_limit:
          type: integer
          format: uint64
          minimum: 1
          maximum: 100000
    contractResponse:
      type: object
      required: [id, code, storage]
      properties:
        id:
          type: string
        code:
          type: string
          description: The deployed bytecode, lowercase hex.
        storage:
          type: object
          description: Cells written so far, decimal key to value.
          additionalProperties:
            type: integer
            format: uint64
    txIn:
      type: object
      required: [PrevTxID, OutIndex, PublicKey, Signature]
      properties:
        PrevTxID:
          type: string
        OutIndex:
          type: integer
          format: uint32
        PublicKey:
          type: string
        Signature:
          type: string
    txOut:
      type: object
      required: [Amount, Address]
      properties:
        Amount:
          type: integer
          format: uint64
        Address:
          type: string
    block:
      type: object
      required: [Index, Timestamp, Transactions, Hash, PrevHash, Nonce, Difficulty, Validator, Signature]
      properties:
        Index:
          type: integer
        Timestamp:
          type: string
          format: date-time
        Transactions:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/transaction"
        Hash:
          type: string
        PrevHash:
          type: string
        Nonce:
          type: integer
        Difficulty:
          type: integer
        Validator:
          type: string
        Signature:
          type: string
    blocksResponse:
      type: object
      required: [Blocks]
      properties:
        Blocks:
          type: array
          items:
            $ref: "#/components/schemas/block"
    pageResponse:
      type: object
      required: [blocks, from, limit]
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/block"
        from:
          type: integer
        limit:
          type: integer
        next:
          type: integer
          description: Height of the next page; present only when a block exists there.
    healthResponse:
      type: object
      required: [status, height, tip]
      properties:
        status:
          type: string
        height:
          type: integer
        tip:
          type: string
    txResponse:
      type: object
      required: [transaction, block_hash, height]
      properties:
        transaction:
          $ref: "#/components/schemas/transaction"
        block_hash:
          type: string
        height:
          type: integer
    proofStep:
      type: object
      required: [hash, side]
      properties:
        hash:
          type: string
        side:
          type: string
          enum: [left, right]
    proofResponse:
      type: object
      required: [tx_id, block_index, block_hash, merkle_root, leaf_index, leaf_hash, proof]
      properties:
        tx_id:
          type: string
        block_index:
          type: integer
        block_hash:
          type: string
        merkle_root:
          type: string
        leaf_index:
          type: integer
        leaf_hash:
          type: string
        proof:
          type: array
          items:
            $ref: "#/components/schemas/proofStep"
    utxo:
      type: object
      required: [txid, index, amount]
      properties:
        txid:
          type: string
        index:
          type: integer
          format: uint32
        amount:
          type: integer
          format: uint64
    balanceResponse:
      type: object
      required: [address, balance, utxos]
      properties:
        address:
          type: string
        balance:
          type: integer
          format: uint64
        utxos:
          type: array
          items:
            $ref: "#/components/schemas/utxo"
    addressTx:
      type: object
      required: [transaction, block_hash, height, timestamp]
      properties:
        transaction:
          $ref: "#/components/schemas/transaction"
        block_hash:
          type: string
        height:
          type: integer
        timestamp:
          type: string
          format: date-time
    addressTxsResponse:
      type: object
      required: [address, txs, limit, pruned_below]
      properties:
        address:
          type: string
        txs:
          type: array
          items:
            $ref: "#/components/schemas/addressTx"
        limit:
          type: integer
        next:
          type: string
          description: Id of the last item; present only when older transactions remain.
        pruned_below:
          type: integer
          description: Heights below it are not listed (0 when nothing was pruned).
    submitResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string
    mempoolResponse:
      type: object
      required: [transactions]
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/transaction"
    hello:
      type: object
      required: [version, node_id, genesis_hash, height, tip_hash, listen_addr]
      properties:
        version:
          type: integer
        node_id:
          type: string
          description: 32 lowercase hex characters.
        genesis_hash:
          type: string
          description: 64 lowercase hex characters.
        height:
          type: integer
          minimum: 0
        tip_hash:
          type: string
          description: 64 lowercase hex characters.
        listen_addr:
          type: string
          description: Base URL where the sender accepts peers, or empty.
    peer:
      type: object
      required: [node_id, addr, height, tip_hash, inbound, last_seen]
      properties:
        node_id:
          type: string
        addr:
          type: string
        height:
          type: integer
        tip_hash:
          type: string
        inbound:
          type: boolean
        last_seen:
          type: string
          format: date-time
    peersResponse:
      type: object
      required: [peers, addrs]
      properties:
        peers:
          type: array
          items:
            $ref: "#/components/schemas/peer"
        addrs:
          type: array
          items:
            type: string
    invItem:
      type: object
      required: [type, hash]
      properties:
        type:
          type: string
          enum: [block, tx]
        hash:
          type: string
          description: 64 lowercase hex characters; the block hash or the transaction ID.
    invRequest:
      type: object
      required: [node_id, items]
      properties:
        node_id:
          type: string
          description: 32 lowercase hex characters; the sender's id from the handshake.
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/invItem"
    wantResponse:
      type: object
      required: [want]
      properties:
        want:
          type: array
          items:
            $ref: "#/components/schemas/invItem"
    blockGossipRequest:
      type: object
      required: [node_id, block]
      properties:
        node_id:
          type: string
        block:
          $ref: "#/components/schemas/block"
    txGossipRequest:
      type: object
      required: [node_id, tx]
      properties:
        node_id:
          type: string
        tx:
          $ref: "#/components/schemas/transaction"
    gossipResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, known]
