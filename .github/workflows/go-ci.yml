name: Go CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Install dependencies
      run: go mod download

    - name: Cache embedded Postgres binaries
      uses: actions/cache@v4
      with:
        path: ~/.embedded-postgres-go
        key: embedded-postgres-18.3.0-${{ runner.os }}

    - name: Run Tests (race + coverage profile)
      run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

    - name: Check coverage floor
      run: scripts/check-coverage.sh coverage.out 90.0

    - name: Run PoW benchmarks once (smoke)
      run: go test -run='^$' -bench=. -benchtime=1x ./internal/consensus/pow/

    - name: Check generated client is up to date
      run: go generate ./client/... && git diff --exit-code client/

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: v2.15.0

  vuln:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: gremlins on the PR diff (zero LIVED, NOT COVERED or TIMED OUT)
      run: scripts/check-mutation.sh origin/${{ github.base_ref }}

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build image and check GET /health
      run: scripts/docker-smoke.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Three-node docker compose e2e
      run: go test -tags e2e -count=1 -timeout 20m ./e2e/...

  release-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: goreleaser check
      run: go run github.com/goreleaser/goreleaser/v2@v2.19.0 check

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Install syft
      uses: anchore/sbom-action/download-syft@v0

    - name: Install cosign
      uses: sigstore/cosign-installer@v3

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Snapshot release (no publish, no signature)
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: v2.19.0
        args: release --snapshot --clean --skip=publish,sign

    - name: Check SBOMs and images
      run: |
        archives=$(find dist -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
        sboms=$(find dist -maxdepth 1 -name '*.sbom.json' | wc -l)
        echo "archives=$archives sboms=$sboms"
        [ "$archives" -gt 0 ] && [ "$archives" -eq "$sboms" ] || { echo "want one SBOM per archive"; exit 1; }
        docker image ls
        for arch in amd64 arm64; do
          docker image ls ghcr.io/petersonsalme/blockchain-with-go | grep -q "$arch" || { echo "missing $arch image"; exit 1; }
        done
